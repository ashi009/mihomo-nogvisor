name: native Linux

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or branch to validate
        type: string
        required: false
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - name: Install Jsonnet
        run: sudo apt-get update && sudo apt-get install -y jsonnet
      - name: Test local automation
        run: python3 -m unittest discover -s tests/automation -v
      - name: Prepare pinned sources and apply independent patches
        run: scripts/prepare-native.sh "$RUNNER_TEMP/native"
      - name: Build and exercise native backend and capture
        shell: bash
        run: |
          set -o pipefail
          revision=$(python3 -c 'import json; print(json.load(open("upstream.json"))["revision"])')
          tests/linux/run.sh "$RUNNER_TEMP/native/mihomo-$revision" "$RUNNER_TEMP/native" 2>&1 | tee "$RUNNER_TEMP/native/linux-tests.log"
          "$RUNNER_TEMP/native/mihomo" -v | tee "$RUNNER_TEMP/native/version.txt"
          sha256sum "$RUNNER_TEMP/native/mihomo" > "$RUNNER_TEMP/native/SHA256SUMS"
      - name: Package and exercise APK lifecycle
        run: |
          package=$(scripts/package-native.sh "$RUNNER_TEMP/native/mihomo" "$RUNNER_TEMP/native")
          tests/openwrt/package.sh "$package"
      - name: Report binary size
        if: always()
        shell: bash
        run: |
          work="$RUNNER_TEMP/native"
          if [ ! -f "$work/mihomo" ]; then
            echo 'Native binary was not produced; see the failed build/preparation step.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gzip -n -9 -c "$work/mihomo" > "$work/mihomo.gz"
          python3 - "$work" <<'PY'
          import hashlib, json, pathlib, sys
          work = pathlib.Path(sys.argv[1])
          files = []
          for name in ['mihomo', 'mihomo.gz'] + sorted(p.name for p in work.glob('*.apk')):
              data = (work / name).read_bytes()
              files.append({'file': name, 'bytes': len(data), 'mib': round(len(data) / 2**20, 3), 'sha256': hashlib.sha256(data).hexdigest()})
          (work / 'size.json').write_text(json.dumps(files, indent=2) + '\n')
          rows = ['| Artifact | Bytes | MiB |', '|---|---:|---:|']
          rows += [f'| {f["file"]} | {f["bytes"]:,} | {f["mib"]:.3f} |' for f in files]
          (work / 'size.md').write_text('Native ARM64 build, stripped with `-s -w`; gzip uses `-n -9`.\n\n' + '\n'.join(rows) + '\n')
          (work / 'SHA256SUMS').write_text(''.join(f'{f["sha256"]}  {f["file"]}\n' for f in files))
          PY
          cat "$work/size.md" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native/mihomo
            ${{ runner.temp }}/native/mihomo.gz
            ${{ runner.temp }}/native/*.apk
            ${{ runner.temp }}/native/size.json
            ${{ runner.temp }}/native/size.md
            ${{ runner.temp }}/native/runtime-deps.txt
            ${{ runner.temp }}/native/linux-tests.log
            ${{ runner.temp }}/native/version.txt
            ${{ runner.temp }}/native/SHA256SUMS
          if-no-files-found: ignore
