name: track Mihomo upstream

on:
  schedule:
    - cron: '17 1 * * *' # 09:17 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: track-mihomo-upstream
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
      pr: ${{ steps.publish.outputs.pr }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Preserve an existing update PR
        id: existing
        run: |
          url=$(gh pr list --state open --json headRefName,url --jq '[.[] | select(.headRefName | startswith("upstream/mihomo-"))][0].url // empty')
          if [ -n "$url" ]; then
            echo "open=true" >> "$GITHUB_OUTPUT"
            echo "Existing update PR retained: $url" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Resolve upstream and generate highlighted changelog
        id: update
        if: steps.existing.outputs.open != 'true'
        run: python3 scripts/update-upstream.py --output "$RUNNER_TEMP/upstream"
      - name: Create draft update PR
        id: publish
        if: steps.update.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.update.outputs.branch }}
          TITLE: ${{ steps.update.outputs.title }}
          REPORT: ${{ steps.update.outputs.report }}
        run: |
          closed=$(gh pr list --state closed --head "$BRANCH" --json number --jq 'length')
          if [ "$closed" != 0 ]; then
            echo "This upstream revision already has a closed PR; waiting for a new revision." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            # Recover a run interrupted after push without overwriting the branch.
            git fetch origin "$BRANCH"
            sha=$(git rev-parse FETCH_HEAD)
          else
            git switch -c "$BRANCH"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add upstream.json "$REPORT"
            git commit -m "$TITLE"
            git push origin "HEAD:refs/heads/$BRANCH"
            sha=$(git rev-parse HEAD)
          fi
          url=$(gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" --draft --title "$TITLE" --body-file "$RUNNER_TEMP/upstream/body.md")
          pr=$(gh pr view "$url" --json number --jq .number)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "Opened $url" >> "$GITHUB_STEP_SUMMARY"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$sha" -f state=pending -f context=native-linux -f description='Applying patches and running native Linux tests' -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  validate:
    needs: propose
    if: needs.propose.outputs.sha != ''
    permissions:
      contents: read
    uses: ./.github/workflows/native.yml
    with:
      ref: ${{ needs.propose.outputs.sha }}

  report:
    needs: [propose, validate]
    if: always() && needs.propose.outputs.sha != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ needs.propose.outputs.sha }}
      PR: ${{ needs.propose.outputs.pr }}
      RESULT: ${{ needs.validate.result }}
    steps:
      - name: Report checks on the exact proposed commit
        run: |
          state=failure
          description='Native Linux checks failed; inspect this run before merging'
          if [ "$RESULT" = success ]; then
            state=success
            description='Independent patches, native backend and capture tests passed'
          fi
          gh api "repos/$GH_REPO/statuses/$SHA" -f "state=$state" -f context=native-linux -f "description=$description" -f target_url="$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
          ready=$(gh pr view "$PR" --json state,isDraft,headRefOid --jq '.state == "OPEN" and .isDraft and .headRefOid == env.SHA')
          if [ "$RESULT" = success ] && [ "$ready" = true ]; then
            gh pr ready "$PR"
          fi
