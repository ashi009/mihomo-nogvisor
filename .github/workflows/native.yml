name: native Linux

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or branch to validate
        type: string
        required: false
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Install Jsonnet
        run: sudo apt-get update && sudo apt-get install -y jsonnet
      - name: Test upstream report generator
        run: python3 -m unittest discover -s tests/automation -v
      - name: Prepare pinned sources and apply independent patches
        run: scripts/prepare-native.sh "$RUNNER_TEMP/native"
      - name: Build and exercise native backend and capture
        shell: bash
        run: |
          set -o pipefail
          revision=$(python3 -c 'import json; print(json.load(open("upstream.json"))["revision"])')
          tests/linux/run.sh "$RUNNER_TEMP/native/mihomo-$revision" "$RUNNER_TEMP/native" 2>&1 | tee "$RUNNER_TEMP/native/linux-tests.log"
          "$RUNNER_TEMP/native/mihomo" -v | tee "$RUNNER_TEMP/native/version.txt"
          sha256sum "$RUNNER_TEMP/native/mihomo" > "$RUNNER_TEMP/native/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native/mihomo
            ${{ runner.temp }}/native/linux-tests.log
            ${{ runner.temp }}/native/version.txt
            ${{ runner.temp }}/native/SHA256SUMS
          if-no-files-found: ignore
